<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Tribe Feedback</title><link rel="stylesheet" href="/assets/site.css"><style>main{min-height:75vh;display:grid;place-items:center;padding:48px 18px}.feedback{width:min(100%,620px);padding:28px;border:2px solid var(--ink);border-radius:22px;background:#fff}.feedback h1{font-family:var(--display);font-size:clamp(34px,7vw,56px);line-height:.95}.feedback label{display:grid;gap:7px;margin:16px 0;font-weight:800}.feedback textarea{min-height:100px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.stars{display:flex;gap:8px;flex-wrap:wrap}.stars label{margin:0;border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}.stars input{accent-color:var(--red)}.status{min-height:24px;font-weight:800;margin-top:16px}</style></head>
<body><main><section class="feedback"><span class="pill pill-yellow">GAME TRIBE</span><h1>Tell us how it went.</h1><p>Your honest feedback helps make the next Game Tribe Fest better. This takes less than two minutes.</p><form id="feedbackForm"><label>How would you rate your experience?<span class="stars"><label><input required type="radio" name="rating" value="1"> 1</label><label><input type="radio" name="rating" value="2"> 2</label><label><input type="radio" name="rating" value="3"> 3</label><label><input type="radio" name="rating" value="4"> 4</label><label><input type="radio" name="rating" value="5"> 5</label></span></label><label>What did you enjoy most?<textarea name="favourite" maxlength="500" placeholder="Games, people, food, music…"></textarea></label><label>What could we improve?<textarea name="improvements" maxlength="1000" placeholder="Your ideas are welcome."></textarea></label><label style="display:flex;align-items:center;gap:9px"><input type="checkbox" name="recommend"> I would recommend Game Tribe Fest to a friend</label><button class="btn btn-red" type="submit">Send feedback</button><p class="status" id="feedbackStatus" aria-live="polite"></p></form></section></main><script>(function(){var form=document.getElementById('feedbackForm'),status=document.getElementById('feedbackStatus'),token=new URLSearchParams(location.search).get('t')||'';if(!token){form.innerHTML='<p class="status">This feedback link is not valid.</p>';return;}form.addEventListener('submit',function(e){e.preventDefault();var fd=new FormData(form),button=form.querySelector('button');button.disabled=true;button.textContent='Sending…';fetch('/api/merch?action=feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,rating:Number(fd.get('rating')),favourite:fd.get('favourite'),improvements:fd.get('improvements'),recommend:fd.get('recommend')==='on'})}).then(function(r){return r.json().then(function(x){if(!r.ok)throw new Error(x.message||'Could not send feedback.');return x;});}).then(function(){form.innerHTML='<h2>Thank you!</h2><p>Your feedback has been received. See you at the next Game Tribe Fest.</p>';}).catch(function(error){status.textContent=error.message;button.disabled=false;button.textContent='Send feedback';});});}());</script></body></html>
