<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Tribe Feedback</title><meta name="robots" content="noindex"><meta name="theme-color" content="#E8342A"><link rel="icon" href="/assets/logo.png" type="image/png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/site.css"><style>
body{background:var(--cream)}
.fb-top{display:flex;justify-content:center;padding:18px 18px 0}.fb-top img{height:46px;width:auto}
main{min-height:calc(100vh - 64px);display:grid;place-items:start center;padding:22px 16px 56px}
.feedback{width:min(100%,640px);padding:26px 20px;border:1px solid var(--line);border-radius:26px;background:#fff;box-shadow:0 18px 50px rgba(28,20,16,.1)}
.feedback h1{font-family:var(--display);text-transform:uppercase;font-size:clamp(28px,8vw,48px);line-height:1;margin:14px 0 10px;overflow-wrap:break-word}
.feedback>p{color:rgba(28,20,16,.72);margin-bottom:6px}
.feedback form{display:grid;gap:20px;margin-top:18px}
.fb-q{display:grid;gap:8px;font-weight:800;font-size:15px;border:0;padding:0;margin:0;min-width:0}
.fb-q legend{padding:0;margin-bottom:8px;font-weight:800}
.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stars label{position:relative;display:block;margin:0}
.stars input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.stars span{display:grid;place-items:center;min-height:52px;border:1.5px solid rgba(28,20,16,.25);border-radius:14px;font:800 18px var(--body);background:#fff;transition:background .15s,color .15s,border-color .15s}
.stars input:checked+span{background:var(--red);border-color:var(--red);color:#fff}
.stars input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.stars label:hover span{border-color:var(--ink)}
.fb-scale{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:rgba(28,20,16,.6);margin-top:2px}
.feedback textarea{width:100%;min-height:110px;padding:12px 14px;border:1.5px solid rgba(28,20,16,.25);border-radius:12px;font:600 16px var(--body);color:var(--ink);resize:vertical}
.feedback textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(251,182,20,.5)}
.fb-check{display:flex;align-items:center;gap:12px;font-weight:800;cursor:pointer;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--cream)}
.fb-check input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--red)}
.feedback .btn{width:100%;min-height:52px;font-size:15px}
.status{min-height:24px;font-weight:800;margin:0;color:var(--red)}
.feedback form>h2{font-family:var(--display);text-transform:uppercase;font-size:clamp(24px,6vw,34px);color:var(--ink)}
@media(min-width:640px){.feedback{padding:38px}.stars span{min-height:56px}.feedback .btn{width:auto;min-width:200px}}
</style></head>
<body><header class="fb-top"><a href="/" aria-label="Game Tribe home"><img src="/assets/logo.png" alt="Game Tribe"></a></header><main><section class="feedback"><span class="pill pill-yellow">GAME TRIBE</span><h1>Tell us how it went.</h1><p>Your honest feedback helps make the next Game Tribe Fest better. This takes less than two minutes.</p><form id="feedbackForm"><fieldset class="fb-q"><legend>How would you rate your experience?</legend><div class="stars"><label><input required type="radio" name="rating" value="1"><span>1</span></label><label><input type="radio" name="rating" value="2"><span>2</span></label><label><input type="radio" name="rating" value="3"><span>3</span></label><label><input type="radio" name="rating" value="4"><span>4</span></label><label><input type="radio" name="rating" value="5"><span>5</span></label></div><div class="fb-scale"><span>Poor</span><span>Great</span></div></fieldset><label class="fb-q">What did you enjoy most?<textarea name="favourite" maxlength="500" placeholder="Games, people, food, music…"></textarea></label><label class="fb-q">What could we improve?<textarea name="improvements" maxlength="1000" placeholder="Your ideas are welcome."></textarea></label><label class="fb-check"><input type="checkbox" name="recommend"> I would recommend Game Tribe Fest to a friend</label><div><button class="btn btn-red" type="submit">Send feedback</button></div><p class="status" id="feedbackStatus" aria-live="polite"></p></form></section></main><script>(function(){var form=document.getElementById('feedbackForm'),status=document.getElementById('feedbackStatus'),token=new URLSearchParams(location.search).get('t')||'';if(!token){form.innerHTML='<p class="status">This feedback link is not valid.</p>';return;}form.addEventListener('submit',function(e){e.preventDefault();var fd=new FormData(form),button=form.querySelector('button');button.disabled=true;button.textContent='Sending…';fetch('/api/merch?action=feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,rating:Number(fd.get('rating')),favourite:fd.get('favourite'),improvements:fd.get('improvements'),recommend:fd.get('recommend')==='on'})}).then(function(r){return r.json().then(function(x){if(!r.ok)throw new Error(x.message||'Could not send feedback.');return x;});}).then(function(){form.innerHTML='<h2>Thank you!</h2><p>Your feedback has been received. See you at the next Game Tribe Fest.</p>';}).catch(function(error){status.textContent=error.message;button.disabled=false;button.textContent='Send feedback';});});}());</script></body></html>
