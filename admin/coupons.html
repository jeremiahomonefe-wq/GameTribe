<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Tribe Coupons</title>
<style>body{font-family:system-ui,sans-serif;background:#f6f0e5;color:#21170f;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}h1{margin:0 0 8px}.card{background:white;border:1px solid #ddd0bd;border-radius:16px;padding:18px;margin:18px 0}label{display:block;font-weight:700;font-size:13px;margin:12px 0}input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b9aa98;border-radius:8px;margin-top:5px}button,.link{background:#9c211a;color:#fff;border:0;padding:10px 14px;border-radius:9px;font-weight:700;cursor:pointer}.secondary{background:#21170f}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.listitem{border-top:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#6b6258;font-size:13px}.status{margin:10px 0;font-weight:700}.bad{color:#a51e18}.good{color:#18703a}@media(max-width:600px){.row{grid-template-columns:1fr}.listitem{align-items:flex-start;flex-direction:column}}</style></head>
<body><div class="wrap"><a href="/admin/" class="link secondary">← Back to Admin</a><h1>Coupons & Promo Codes</h1><p class="muted">Create a code and set the final price buyers will pay per ticket.</p><div id="status" class="status"></div>
<div class="card"><h2 id="formTitle">Create coupon</h2><form id="couponForm"><div class="row"><label>Coupon code<input id="code" required maxlength="32" placeholder="CHURCH50" pattern="[A-Za-z0-9_-]{2,32}"></label><label>Display name<input id="name" maxlength="100" placeholder="Church community discount"></label></div><div class="row"><label>Final price per ticket (₦)<input id="price" type="number" min="0" step="1" required placeholder="3500"></label><label>Expiry (optional)<input id="expiry" type="datetime-local"></label></div><label>Applies to ticket types (leave none for all)<select id="types" multiple size="5"></select><p class="muted">Hold Ctrl (Windows) or Command (Mac) to select multiple ticket types. No selection means all tickets.</p><label><input id="active" type="checkbox" checked style="width:auto"> Active</label><button type="submit">Save coupon</button><button type="button" class="secondary" id="reset">Clear form</button></form></div>
<div class="card"><h2>Existing coupons</h2><div id="coupons">Loading…</div></div></div>
<script>
(function(){const $=id=>document.getElementById(id);let ticketList=[],couponList=[];
function status(msg,bad){$('status').textContent=msg;$('status').className='status '+(bad?'bad':'good');}
function money(n){return '₦'+Number(n||0).toLocaleString('en-NG');}
async function api(action,method='GET',body){const r=await fetch('/api/admin?action='+action,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d;}
function loadTypes(){ $('types').innerHTML=ticketList.map(t=>'<option value="'+t.id+'">'+t.label+' ('+money(t.price)+')</option>').join('');}
function reset(){ $('couponForm').reset();$('active').checked=true;$('formTitle').textContent='Create coupon';Array.from($('types').options).forEach(o=>o.selected=false);}
function render(){ $('coupons').innerHTML=couponList.length?couponList.map(c=>'<div class="listitem"><div><b>'+c.code+'</b> - '+(c.name||'')+'<br>'+money(c.final_price)+' final price · '+(c.active?'Active':'Inactive')+' · Used '+Number(c.redemption_count||0)+' times'+(c.expires_at?' · Expires '+new Date(c.expires_at).toLocaleString():'')+'<br><span class="muted">Applies: '+(c.ticket_types&&c.ticket_types.length?c.ticket_types.join(', '):'All tickets')+'</span></div><div><button data-edit="'+c.id+'">Edit</button> <button class="secondary" data-delete="'+c.id+'">Delete</button></div></div>').join(''):'No coupons yet.';}
async function refresh(){const d=await api('coupons');couponList=d.coupons||[];render();}
$('couponForm').addEventListener('submit',async e=>{e.preventDefault();try{const code=$('code').value.trim().toUpperCase(),expiry=$('expiry').value?new Date($('expiry').value).toISOString():null,types=Array.from($('types').selectedOptions).map(o=>o.value);await api('coupon-save','POST',{code,name:$('name').value.trim()||code,final_price:Number($('price').value),ticket_types:types,active:$('active').checked,expires_at:expiry});status('Coupon saved.');reset();await refresh();}catch(err){status(err.message,true);}});
$('reset').onclick=reset;$('coupons').addEventListener('click',async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete;try{if(edit){const c=couponList.find(x=>x.id===edit);if(!c)return;$('code').value=c.code;$('name').value=c.name||'';$('price').value=c.final_price;$('expiry').value=c.expires_at?new Date(c.expires_at).toISOString().slice(0,16):'';$('active').checked=!!c.active;Array.from($('types').options).forEach(o=>o.selected=(c.ticket_types||[]).includes(o.value));$('formTitle').textContent='Edit coupon: '+c.code;window.scrollTo({top:0,behavior:'smooth'});}else if(del&&confirm('Delete this coupon?')){const c=couponList.find(x=>x.id===del);await api('coupon-delete','POST',{id:del,code:c&&c.code});status('Coupon deleted.');await refresh();}}catch(err){status(err.message,true);}});
(async()=>{try{const content=await api('content');ticketList=content.tickets||[];loadTypes();await refresh();}catch(err){status(err.message,true);$('coupons').textContent='Could not load coupons. Log into the main admin first.';}})();})();
</script></body></html>
