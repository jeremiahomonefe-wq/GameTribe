<!DOCTYPE html>
<html lang="en">
<head>
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Game Tribe Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E8342A;--red-dark:#B8231B;--gold:#FBB614;--cream:#FFF6E5;--ink:#1C1410;--bg:#F6F2EA;--card:#fff;--line:#E7DFCF;--muted:#6B6258;--ok:#1E8E4E;
--display:'Bowlby One',Impact,sans-serif;--body:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ink)}
.login-card{width:100%;max-width:380px;background:var(--cream);border-radius:24px;padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.login-card h1{font-family:var(--display);text-transform:uppercase;font-size:28px;line-height:1;margin:0 0 6px}
.login-card p{margin:0 0 22px;color:var(--muted)}
.login-card .err{color:var(--red);font-weight:700;font-size:14px;min-height:20px;margin:10px 0 0}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1.5px solid transparent;font-weight:800;font-size:14px;cursor:pointer;transition:all .15s;background:none;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-red{background:var(--red);color:#fff}.btn-red:hover:not(:disabled){background:var(--red-dark)}
.btn-ink{background:var(--ink);color:#fff}.btn-ink:hover:not(:disabled){background:#000}
.btn-line{border-color:var(--ink);color:var(--ink)}.btn-line:hover:not(:disabled){background:var(--ink);color:#fff}
.btn-ghost{color:var(--muted);padding:8px 12px}.btn-ghost:hover{color:var(--ink);background:rgba(0,0,0,.05)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.danger{color:var(--red)}.btn.danger:hover{background:rgba(232,52,42,.1)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],input[type=search],textarea,select{width:100%;padding:10px 12px;border:1.5px solid #D6CCB8;border-radius:12px;background:#fff;font-weight:600}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(251,182,20,.45)}
textarea{min-height:92px;resize:vertical}

/* shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--ink);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--display);text-transform:uppercase;font-size:20px;line-height:1;padding:6px 10px 18px}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.2em;color:var(--gold);margin-top:6px;font-weight:800}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin-bottom:2px;border:0;border-radius:12px;background:none;color:rgba(255,255,255,.75);font-weight:700;font-size:14px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current=true]{background:var(--gold);color:var(--ink)}
.nav .sep{height:1px;background:rgba(255,255,255,.12);margin:10px 6px}
.nav .sep-label{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding:4px 12px 6px}
.nav .ico{width:22px;text-align:center}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 28px;background:rgba(246,242,234,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h2{font-family:var(--display);text-transform:uppercase;font-size:20px;margin:0;flex:1;min-width:160px}
.status{font-size:13px;font-weight:700;color:var(--muted)}
.status.dirty{color:var(--red)}.status.ok{color:var(--ok)}
.content{padding:24px 28px 80px;max-width:980px}
@media(max-width:900px){
  .nav .sep-label{display:none}
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:12px}
  .brand{padding:4px 8px 10px}
  .nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .nav button{width:auto;white-space:nowrap;margin:0}
  .nav .sep{display:none}
  .top{padding:10px 14px}.content{padding:16px 14px 80px}
}

/* cards & fields */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px}
.card>h3{font-family:var(--display);text-transform:uppercase;font-size:15px;margin:0 0 4px}
.card>.help{margin:0 0 16px;color:var(--muted);font-size:14px}
.grid{display:grid;gap:14px}
@media(min-width:700px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.field label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}
.field .help{font-size:12px;color:var(--muted);margin-top:4px}
.field.full{grid-column:1/-1}

/* media field */
.media{display:flex;gap:12px;align-items:flex-start}
.thumb{flex:0 0 84px;width:84px;height:64px;border-radius:12px;background:#EFE8D8 center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:800;overflow:hidden}
.thumb video{width:100%;height:100%;object-fit:cover}
.thumb.contain{background-size:contain;background-color:#fff}
.media-body{flex:1;min-width:0}
.media-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.bar{height:6px;border-radius:6px;background:#E7DFCF;overflow:hidden;width:120px}.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .1s}
.msg{font-size:12px;font-weight:700}.msg.err{color:var(--red)}

/* list items */
.item{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:#FDFBF6}
.item-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.item-head b{flex:1;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile-grid .media{flex-direction:column}
.tile-grid .thumb{flex:none;width:100%;height:96px}
.tile-grid .item{margin:0}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--red)}

/* sales */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;color:var(--red)}
.kpi span{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--ink);color:#fff;text-align:left;padding:10px 12px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:#FFFBF0}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800}
.badge.ok{background:#DDF3E5;color:var(--ok)}.badge.warn{background:#FDE0DD;color:var(--red)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input{max-width:300px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.notice{background:#FFF1C9;border:1px solid #F0D27A;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:16px;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.err{background:var(--red)}
.dropzone{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;text-align:center;border:2px dashed #D6CCB8;border-radius:16px;padding:18px;margin-bottom:14px;background:#fff;transition:all .15s}
.dropzone.over{border-color:var(--red);background:#FFF1EF}
.dropzone small{flex-basis:100%;color:var(--muted);font-size:12px}
.bulk{position:fixed;right:18px;bottom:18px;width:min(380px,calc(100vw - 36px));background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;z-index:60;box-shadow:0 14px 40px rgba(0,0,0,.4);font-size:14px}
.bulk .bar{margin-top:10px;width:100%;height:8px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
.bulk .bar i{display:block;height:100%;background:var(--gold);transition:width .2s}
.bulk ul{margin:10px 0 0;padding-left:18px;font-size:12px;color:#FFB4AE}
.bulk button{margin-top:10px;background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,52,42,.6)}50%{box-shadow:0 0 0 10px rgba(232,52,42,0)}}
.btn-red.pulse{animation:pulse 1.1s ease infinite}
.badge.used{background:#FDE0DD;color:var(--red)}.badge.part{background:#FFF1C9;color:#8A5A00}.badge.none{background:#DDF3E5;color:var(--ok)}
.small{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}
tr.row-used td{background:#FBF4F3}
.who{font-size:13px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.modal-back{position:fixed;inset:0;background:rgba(28,20,16,.55);display:grid;place-items:center;padding:16px;z-index:70}
.modal{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.modal h3{font-family:var(--display);text-transform:uppercase;font-size:20px;margin:0 0 10px}
.banner{border-radius:14px;padding:12px 14px;font-weight:800;margin-bottom:12px;line-height:1.4}
.banner.ok{background:#DDF3E5;color:var(--ok)}.banner.warn{background:#FFF1C9;color:#8A5A00}.banner.bad{background:#FDE0DD;color:var(--red)}
.kv{display:grid;grid-template-columns:100px 1fr;gap:6px 10px;font-size:14px;margin:0 0 14px}
.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0;font-weight:700;word-break:break-word}
.modal .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.modal .row input[type=number]{width:96px}
.hist{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.hist li{padding:6px 0;border-top:1px solid var(--line)}
.linkbox{display:flex;gap:8px;margin-top:8px}
.modal.wide{max-width:780px}
.rc-card{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.rc-card.ready{border-color:#9AD2AE}.rc-card.review{border-color:#E8B2AC}.rc-card.done{border-color:#9AD2AE;background:#F2FAF5}
.rc-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800}
.rc-meta{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;word-break:break-word}
.rc-note{font-size:13px;font-weight:700;margin-top:8px;line-height:1.45}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <h1>Game Tribe<br>Admin</h1>
    <p>Team members: use your email and password. Main admin: leave the email empty.</p>
    <label for="em" style="font-weight:800;font-size:13px">Email <span style="font-weight:600;color:var(--muted)">(team members only)</span></label>
    <input type="email" id="em" autocomplete="username" placeholder="Empty if you are the main admin" style="margin-bottom:12px">
    <label for="pw" style="font-weight:800;font-size:13px">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required autofocus>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn btn-red" style="width:100%;margin-top:12px" id="loginBtn">Log in</button>
  </form>
</div>

<!-- INVITE (opened from the emailed link) -->
<div class="login" id="invite" hidden>
  <form class="login-card" id="inviteForm">
    <h1>Welcome to<br>Game Tribe Admin</h1>
    <p id="inviteIntro">Checking your invite…</p>
    <div id="inviteFields" hidden>
      <label for="ipw" style="font-weight:800;font-size:13px">Choose a password (8+ characters)</label>
      <input type="password" id="ipw" autocomplete="new-password" minlength="8" required style="margin-bottom:12px">
      <label for="ipw2" style="font-weight:800;font-size:13px">Repeat the password</label>
      <input type="password" id="ipw2" autocomplete="new-password" minlength="8" required>
      <p class="err" id="inviteErr" role="alert"></p>
      <button class="btn btn-red" style="width:100%;margin-top:12px" id="inviteBtn">Save password &amp; continue</button>
    </div>
    <p class="err" id="inviteFail" role="alert"></p>
    <p style="margin:14px 0 0"><a href="/admin">Go to the login page</a></p>
  </form>
</div>

<!-- APP -->
<div class="shell" id="app" hidden>
  <aside class="side">
    <div class="brand">Game Tribe<small>ADMIN</small></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <h2 id="pageTitle"></h2>
      <span class="who" id="who" hidden></span>
      <span class="status" id="status" aria-live="polite"></span>
      <button class="btn btn-ghost sm" id="checkBtn" type="button">Check connection</button>
      <a class="btn btn-line sm" href="/" target="_blank" rel="noopener">View website</a>
      <button class="btn btn-ghost sm" id="logoutBtn" type="button">Log out</button>
      <button class="btn btn-red" id="saveBtn" type="button" disabled>Publish changes</button>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="toastHost" aria-live="polite"></div>
<div id="modalHost"></div>

<script>
/* ============================================================
   Field definitions. This drives everything you see on screen.
   ============================================================ */
var T='text',TA='textarea',IMG='image',VID='video',DT='datetime',NUM='number';
var SECTIONS=[
 {id:'event',icon:'📅',title:'Event & countdown',blocks:[
  {title:'Date and venue',help:'The countdown on the website counts down to the start time below (Nigeria time).',fields:[
   {path:'event.date',label:'Event start (Nigeria time)',type:DT,full:true},
   {path:'event.guestCount',label:'“People going” number',type:T,help:'Shown as “200+ people going”.'},
   {path:'event.venueName',label:'Venue section heading',type:T},
   {path:'event.address',label:'Venue address',type:TA,full:true},
   {path:'event.mapLat',label:'Map latitude',type:NUM,step:'any',help:'In Google Maps, right-click the venue and click the two numbers to copy them.'},
   {path:'event.mapLng',label:'Map longitude',type:NUM,step:'any'}]},
  {title:'Countdown heading',fields:[
   {path:'countdown.kicker',label:'Small text above',type:T},
   {path:'countdown.title',label:'Heading',type:T}]}]},

 {id:'hero',icon:'🏠',title:'Top of page',blocks:[
  {title:'Headline',fields:[
   {path:'hero.pillBrand',label:'Yellow tag',type:T},
   {path:'hero.pillDate',label:'Date tag',type:T,help:'Written by hand (e.g. “📅 27 Nov 2026”). Change it when you change the date.'},
   {path:'hero.pillPlace',label:'Place tag',type:T},
   {path:'hero.titleA',label:'Big title, first word (yellow)',type:T},
   {path:'hero.titleB',label:'Big title, second word (red)',type:T},
   {path:'hero.tagHighlight',label:'Line under title, highlighted word',type:T},
   {path:'hero.tagRest',label:'Line under title, rest',type:T},
   {path:'hero.subtitle',label:'Sentence under the title',type:T,full:true},
   {path:'hero.buttonTickets',label:'Ticket button text',type:T},
   {path:'hero.buttonAttending',label:'“I am attending” button text',type:T}]},
  {title:'Background photos',help:'Six photos shown as tilted prints behind the title.',cols:3,fields:[
   {path:'hero.photos.0',label:'Photo 1',type:IMG},{path:'hero.photos.1',label:'Photo 2',type:IMG},{path:'hero.photos.2',label:'Photo 3',type:IMG},
   {path:'hero.photos.3',label:'Photo 4',type:IMG},{path:'hero.photos.4',label:'Photo 5',type:IMG},{path:'hero.photos.5',label:'Photo 6',type:IMG}]},
  {title:'Scrolling yellow strip',help:'Short messages that scroll across the page.',list:{path:'marquee',strings:true,itemLabel:'Message',blank:''}}]},

 {id:'intro',icon:'🎬',title:'Intro & highlight video',blocks:[
  {title:'Intro text',fields:[
   {path:'intro.pill',label:'Yellow tag',type:T},
   {path:'intro.headingA',label:'Heading (white)',type:T},
   {path:'intro.headingB',label:'Heading (yellow)',type:T},
   {path:'intro.body',label:'Paragraph',type:TA,full:true},
   {path:'intro.goldLine',label:'Yellow line',type:T,full:true}]},
  {title:'Highlight video',fields:[
   {path:'intro.poster',label:'Cover photo',type:IMG,full:true},
   {path:'intro.video',label:'Video',type:VID,full:true},
   {path:'intro.caption',label:'Caption under the video',type:T,full:true}]}]},

 {id:'expecting',icon:'📈',title:'Expected numbers',blocks:[
  {title:'Heading',fields:[
   {path:'expecting.kicker',label:'Small text above',type:T},
   {path:'expecting.title',label:'Heading',type:T},
   {path:'expecting.subtitle',label:'Sentence below',type:TA,full:true}]},
  {title:'Numbers',list:{path:'expecting.stats',itemLabel:'Number',max:4,blank:{value:'',label:''},fields:[
   {key:'value',label:'Number (e.g. 500+)',type:T},{key:'label',label:'What it counts',type:T}]}}]},

 {id:'videos',icon:'🎥',title:'Moments videos',blocks:[
  {title:'Heading',fields:[
   {path:'videos.kicker',label:'Small text above',type:T},
   {path:'videos.title',label:'Heading',type:T},
   {path:'videos.subtitle',label:'Sentence below',type:T,full:true}]},
  {title:'Videos',help:'Upload phone videos (MP4 works best, up to 50 MB each).',grid:true,list:{path:'videos.items',itemLabel:'Video',bulk:'video',blank:{src:''},fields:[
   {key:'src',label:'Video',type:VID}]}}]},

 {id:'sponsors',icon:'🤝',title:'Partners & sponsors',blocks:[
  {title:'Heading',fields:[
   {path:'sponsors.kicker',label:'Small text above',type:T},
   {path:'sponsors.title',label:'Heading',type:T},
   {path:'sponsors.subtitle',label:'Sentence below',type:TA,full:true}]},
  {title:'Categories',help:'Each category becomes its own row of logos on the website, in this order. Categories with no logos are hidden automatically. Click a logo on the website and its link opens inside a Game Tribe page (yoursite.com/their-domain).',
   cards:{path:'sponsors.groups',itemLabel:'Category',titleKey:'title',addLabel:'Add category',blank:{id:'',title:'New category',subtitle:'',size:'normal',items:[]},
    fields:[{key:'title',label:'Category name (shown above the logos)',type:T},
            {key:'size',label:'Logo size',type:'select',options:[['normal','Normal'],['large','Large (good for featured brands)']]},
            {key:'subtitle',label:'Short text under the name (optional)',type:T,full:true}],
    nested:[{key:'items',title:'Logos',itemLabel:'Logo',grid:true,blank:{image:'',name:'',link:''},
      fields:[{key:'image',label:'Logo',type:IMG,contain:true},{key:'name',label:'Name',type:T},
              {key:'link',label:'Website link (optional)',type:T,help:'Clicking the logo opens this site inside a Game Tribe page, e.g. yoursite.com/get.falconlite.com'}]}]}}]},

 {id:'vendorBand',icon:'🛍️',title:'Vendor invitation',blocks:[
  {title:'Red vendor section',fields:[
   {path:'vendorBand.pill',label:'Tag',type:T},
   {path:'vendorBand.headingA',label:'Heading (white)',type:T},
   {path:'vendorBand.headingB',label:'Heading (yellow)',type:T},
   {path:'vendorBand.body',label:'Paragraph',type:TA,full:true},
   {path:'vendorBand.goldLine',label:'Yellow line',type:T},
   {path:'vendorBand.button',label:'Button text',type:T},
   {path:'vendorBand.image',label:'Photo',type:IMG,full:true}]}]},

 {id:'games',icon:'🎲',title:'Games',blocks:[
  {title:'Heading',fields:[
   {path:'games.kicker',label:'Small text above',type:T},
   {path:'games.title',label:'Heading',type:T},
   {path:'games.subtitle',label:'Sentence below',type:TA,full:true}]},
  {title:'Games on the day',help:'They appear in this order, alternating left and right.',list:{path:'games.items',itemLabel:'Game',blank:{emoji:'🎮',kicker:'',name:'',description:'',image:''},fields:[
   {key:'name',label:'Game name',type:T},{key:'emoji',label:'Emoji',type:T},{key:'kicker',label:'Small label above name',type:T},
   {key:'description',label:'Description',type:TA,full:true},{key:'image',label:'Photo',type:IMG,full:true}]}}]},

 {id:'gallery',icon:'📸',title:'Gallery',blocks:[
  {title:'Heading',fields:[
   {path:'gallery.kicker',label:'Small text above',type:T},
   {path:'gallery.title',label:'Heading',type:T}]},

var state={content:null,saved:'',dirty:false,section:'event',sales:null,team:null,teamResult:null,salesFilter:'all',role:'owner',me:null};
var $=function(s,r){return (r||document).querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function getP(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k];},o);}
function setP(o,p,v){var k=p.split('.'),last=k.pop(),t=k.reduce(function(a,x){if(a[x]==null)a[x]=isNaN(x)?{}:[];return a[x];},o);t[last]=v;}
function clone(x){return JSON.parse(JSON.stringify(x));}
function api(action,opt){
  opt=opt||{};
  return fetch('/api/admin?action='+action,{method:opt.body?'POST':'GET',credentials:'same-origin',headers:opt.body?{'Content-Type':'application/json'}:{},body:opt.body?JSON.stringify(opt.body):undefined})
   .then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok){var e=new Error(d.message||('Error '+r.status));e.status=r.status;e.data=d;throw e;}return d;});});
}
function toast(msg,err){var t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('#toastHost').appendChild(t);setTimeout(function(){t.remove();},err?5000:2400);}
function srcUrl(v){v=String(v||'');return /^(https?:|data:|\/)/.test(v)?v:(v?'/'+v:'');}

/* ---------- dirty tracking ---------- */
function markDirty(){
  state.dirty=JSON.stringify(state.content)!==state.saved;
  var s=$('#status');
  if(state.dirty){s.textContent='Unpublished changes';s.className='status dirty';}
  else if(!s.dataset.keep){s.textContent='';s.className='status';}
  $('#saveBtn').disabled=!state.dirty;
}
window.addEventListener('beforeunload',function(e){if(state.dirty){e.preventDefault();e.returnValue='';}});
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();if(state.dirty)save();return;}
  if(e.key==='Escape'&&$('#modalHost').firstChild){closeModal();return;}
  /* Gate shortcut: Enter in the search box opens the ticket if exactly one person matches */
  if(e.key==='Enter'&&e.target&&e.target.id==='salesSearch'&&canCheckin()&&state.sales){
    e.preventDefault();
    var f=state.salesFilter||'all',hit=(state.sales.sales||[]).filter(function(r){return saleMatches(r,e.target.value)&&(f==='all'||saleStatus(r)===f);});
    if(hit.length===1)gateModal(hit[0].reference);else if(hit.length>1)toast(hit.length+' people match. Type more of the reference or phone number.',true);else toast('Nobody matches that.',true);
    return;
  }
  if(e.key==='Enter'&&e.target&&(e.target.id==='gateCount')&&$('#gateAdmit')){e.preventDefault();$('#gateAdmit').click();}
});

function save(){
  var b=$('#saveBtn');b.disabled=true;b.textContent='Publishing…';
  api('save',{body:{content:state.content}}).then(function(){
    state.saved=JSON.stringify(state.content);state.dirty=false;
    var s=$('#status');s.textContent='Published ✓ — live in a few seconds';s.className='status ok';s.dataset.keep='1';
    setTimeout(function(){delete s.dataset.keep;markDirty();},6000);
  }).catch(function(e){
    if(e.status===401){showLogin();return;}
    toast(e.message,true);
  }).then(function(){b.classList.remove('pulse');b.textContent='Publish changes';b.disabled=!state.dirty;});
}

/* ---------- uploads ---------- */
function resizeImage(file,maxW){
  return new Promise(function(resolve){
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)){resolve(file);return;}
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      URL.revokeObjectURL(u);
      if(img.width<=maxW){resolve(file);return;}
      var c=document.createElement('canvas');c.width=maxW;c.height=Math.round(img.height*maxW/img.width);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var type=file.type==='image/png'?'image/png':'image/jpeg';
      c.toBlob(function(b){resolve(b?new File([b],file.name,{type:type}):file);},type,.86);
    };
    img.onerror=function(){resolve(file);};
    img.src=u;
  });
}
function uploadFile(file,folder,onProgress){
  return resizeImage(file,file.type==='image/png'?1400:1800).then(function(f){
    return api('sign-upload',{body:{filename:f.name,contentType:f.type,folder:folder}}).then(function(sig){
      return new Promise(function(resolve,reject){
        var fd=new FormData();fd.append('cacheControl','3600');fd.append('',f);
        var x=new XMLHttpRequest();x.open('PUT',sig.uploadUrl);
        if(sig.anonKey){x.setRequestHeader('apikey',sig.anonKey);x.setRequestHeader('Authorization','Bearer '+sig.anonKey);}
        x.setRequestHeader('x-upsert','false');
        x.upload.onprogress=function(e){if(e.lengthComputable)onProgress(e.loaded/e.total);};
        x.onload=function(){
          if(x.status>=200&&x.status<300)resolve(sig.publicUrl);
          else{var m='Upload failed ('+x.status+').';try{m=JSON.parse(x.responseText).message||m;}catch(e){}reject(new Error(m));}
        };
        x.onerror=function(){reject(new Error('Upload failed. Check your internet connection.'));};
        x.send(fd);
      });
    });
  });
}

/* ---------- field rendering ---------- */
var uid=0;
function fieldHtml(f,value,bind){
  var id='f'+(++uid),lab='<label for="'+id+'">'+esc(f.label)+'</label>',help=f.help?'<div class="help">'+esc(f.help)+'</div>':'';
  var cls='field'+(f.full?' full':'');
  var b=' data-bind="'+esc(bind)+'" data-type="'+f.type+'"';
  if(f.type===TA)return '<div class="'+cls+'">'+lab+'<textarea id="'+id+'"'+b+'>'+esc(value)+'</textarea>'+help+'</div>';
  if(f.type==='select')return '<div class="'+cls+'">'+lab+'<select id="'+id+'"'+b+'>'+f.options.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===value?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>'+help+'</div>';
  if(f.type===NUM)return '<div class="'+cls+'">'+lab+'<input id="'+id+'" type="number" step="'+(f.step||'1')+'" value="'+esc(value)+'"'+b+'>'+help+'</div>';
  if(f.type===DT){
    var v='';if(value){var ms=Date.parse(value);if(!isNaN(ms))v=new Date(ms+3600000).toISOString().slice(0,16);}
    return '<div class="'+cls+'">'+lab+'<input id="'+id+'" type="datetime-local" value="'+v+'"'+b+'>'+help+'</div>';
  }
  if(f.type===IMG||f.type===VID||f.type==='pdf'){
    var isImg=f.type===IMG,s=srcUrl(value);
    var th=isImg&&s?'<div class="thumb'+(f.contain?' contain':'')+'" data-src="'+esc(s)+'" style="background-image:url(\''+esc(s).replace(/'/g,'%27')+'\')"></div>'
      :(f.type===VID&&s?'<div class="thumb"><video src="'+esc(s)+'" muted preload="metadata"></video></div>':'<div class="thumb">'+(f.type==='pdf'?'PDF':(value?'':'None'))+'</div>');
    var accept=isImg?'image/jpeg,image/png,image/webp,image/gif':(f.type===VID?'video/mp4,video/webm,video/quicktime':'application/pdf');
    return '<div class="'+cls+'">'+lab+'<div class="media">'+th+'<div class="media-body"><input id="'+id+'" type="text" placeholder="Upload a file or paste a link" value="'+esc(value)+'"'+b+'>'+
      '<div class="media-actions"><button class="btn btn-line sm" type="button" data-upload="'+accept+'" data-kind="'+f.type+'">Upload</button>'+
      (value?'<button class="btn btn-ghost sm danger" type="button" data-clear>Remove</button>':'')+
      '<span class="bar" hidden><i></i></span><span class="msg"></span></div></div></div>'+help+'</div>';
  }
  return '<div class="'+cls+'">'+lab+'<input id="'+id+'" type="text" value="'+esc(value)+'"'+b+'>'+help+'</div>';
}

function dropzoneHtml(L){
  var word=L.bulk==='video'?'videos':'photos',tag=L.path+'|'+L.bulk;
  return '<div class="dropzone" data-bulk="'+esc(tag)+'"><b>Drop '+word+' here</b><span>or</span><button class="btn btn-line sm" type="button" data-bulkpick="'+esc(tag)+'">Choose files</button><small>Select as many as you like. Each one is added to this list.</small></div>';
}
function listHtml(block){
  var L=block.list,arr=getP(state.content,L.path)||[];
  var out=(L.bulk?dropzoneHtml(L):'')+'<div class="'+(block.grid?'tile-grid':'')+'">';
  arr.forEach(function(it,i){
    out+='<div class="item"><div class="item-head"><b>'+esc(L.itemLabel)+' '+(i+1)+'</b>'+
      '<button class="btn btn-ghost sm" type="button" data-move="'+L.path+'|'+i+'|-1" '+(i===0?'disabled':'')+' aria-label="Move up">↑</button>'+
      '<button class="btn btn-ghost sm" type="button" data-move="'+L.path+'|'+i+'|1" '+(i===arr.length-1?'disabled':'')+' aria-label="Move down">↓</button>'+
      '<button class="btn btn-ghost sm danger" type="button" data-del="'+L.path+'|'+i+'">Delete</button></div>';
    if(L.strings)out+=fieldHtml({label:L.itemLabel,type:L.textarea?TA:T,full:true},it,L.path+'.'+i);
    else out+='<div class="grid">'+L.fields.map(function(f){return fieldHtml(f,it[f.key],L.path+'.'+i+'.'+f.key);}).join('')+'</div>';
    out+='</div>';
  });
  out+='</div>';
  if(!arr.length)out+='<div class="empty" style="padding:16px">Nothing here yet.</div>';
  if(!L.max||arr.length<L.max)out+='<button class="btn btn-line" type="button" data-add="'+L.path+'">+ Add '+esc(L.itemLabel.toLowerCase())+'</button>';
  return out;
}

function registerLists(){

    if(b.list)REG[b.list.path]=b.list;
    if(b.cards){
      var C=b.cards;REG[C.path]={path:C.path,itemLabel:C.itemLabel,blank:C.blank,max:C.max,addLabel:C.addLabel,askYear:C.askYear,titleKey:C.titleKey};
      (C.nested||[]).forEach(function(n){REG[C.path+'.*.'+n.key]=n;});
    }
  });});
}
function listSpec(path){return REG[regKey(path)]||null;}
function newId(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function cardsHtml(b){

/* ---------- sales view (with gate check-in) ---------- */
function naira(n){return '₦'+Number(n||0).toLocaleString('en-NG');}
function saleTotal(r){return Number(r.admits_total)||1;}
function saleAdmitted(r){return Number(r.admitted_count)||0;}
function saleStatus(r){var a=saleAdmitted(r),t=saleTotal(r);return a>=t?'full':(a>0?'part':'none');}
function stripGT(s){return String(s==null?'':s).toLowerCase().replace(/^(gt-)+/,'');}
function timeShort(iso){var d=new Date(iso);return isNaN(d)?'':d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
/* matches names, phones, emails, references and ticket numbers (with or without the GT- prefix, old GT-GT- numbers included) */
function saleMatches(r,q){
  q=String(q||'').trim().toLowerCase();if(!q)return true;
  var hay=[r.name,r.email,r.phone,r.ticket_number,r.reference,r.ticket_label].join(' ').toLowerCase();
  if(hay.indexOf(q)>-1)return true;
  var sq=stripGT(q);
  if(sq.length>=5&&(stripGT(r.reference).indexOf(sq)>-1||stripGT(r.ticket_number).indexOf(sq)>-1))return true;
  var dq=q.replace(/\D/g,'').replace(/^0+/,'');
  if(dq.length>=7&&String(r.phone||'').replace(/\D/g,'').indexOf(dq)>-1)return true;
  return false;
}
function admitBadge(r){
  var a=saleAdmitted(r),t=saleTotal(r),st=saleStatus(r);
  if(st==='full')return '<span class="badge used">Used · '+a+'/'+t+'</span>';
  if(st==='part')return '<span class="badge part">Partly · '+a+'/'+t+'</span>';
  return '<span class="badge none">Not yet · 0/'+t+'</span>';
}
function salesTopHtml(){
  var rows=state.sales.sales||[],total=0,qty=0,people=0,inside=0,notSent=0,by={};
  rows.forEach(function(r){total+=Number(r.amount||0);qty+=Number(r.quantity||1);people+=saleTotal(r);inside+=saleAdmitted(r);if(!r.email_sent)notSent++;var k=r.ticket_label||r.ticket_type||'Other';by[k]=(by[k]||0)+Number(r.quantity||1);});
  var h='<div class="kpis"><div class="kpi"><b>'+qty+'</b><span>Tickets sold</span></div><div class="kpi"><b>'+people+'</b><span>People covered</span></div>'+
    '<div class="kpi"><b style="color:var(--ok)">'+inside+' / '+people+'</b><span>Checked in at the gate</span></div><div class="kpi"><b>'+rows.length+'</b><span>Orders</span></div>'+
    '<div class="kpi"><b>'+naira(total)+'</b><span>Total paid</span></div>'+
    '<div class="kpi"><b style="'+(notSent?'':'color:var(--ok)')+'">'+notSent+'</b><span>Emails not sent</span></div></div>';
  var bk=Object.keys(by);
  if(bk.length)h+='<section class="card"><h3>By ticket type</h3><div class="grid two">'+bk.map(function(k){return '<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"><span>'+esc(k)+'</span><b>'+by[k]+'</b></div>';}).join('')+'</div></section>';
  return h;
}
function salesHtml(){
  var d=state.sales;
  if(!d)return '<div class="empty">Loading sales…</div>';
  if(d.configured===false)return '<div class="notice">Supabase is not connected yet, so sales cannot be listed. Follow step 2 in the README, then reload.</div>';
  var h='';
  if(state.role!=='owner')h+='<div class="notice">'+(canCheckin()?'You can see everyone who bought a ticket and check people in at the gate. You cannot change tickets or prices.':'You can see everyone who bought a ticket. This view is read-only.')+'</div>';
  h+='<div id="salesTop">'+salesTopHtml()+'</div>';
  h+='<div class="toolbar"><input type="search" id="salesSearch" placeholder="Search name, phone, reference or ticket no."'+(canCheckin()?' autocomplete="off"':'')+'>'+
    '<select id="salesFilter" style="max-width:210px" aria-label="Filter by check-in"><option value="all">Everyone</option><option value="none">Not yet checked in</option><option value="part">Partly checked in</option><option value="full">Fully used</option></select>'+
    '<button class="btn btn-line sm" type="button" id="salesRefresh">Refresh</button>'+(state.role==='owner'?'<button class="btn btn-ink sm" type="button" id="salesCsv">Download CSV</button><button class="btn btn-red sm" type="button" data-act="rc-open">Check against Paystack</button>':'')+'</div>';
  if(canCheckin())h+='<p class="help" style="margin:-4px 0 12px;font-size:13px;color:var(--muted)">At the gate: type or paste the buyer’s reference or ticket number, press Enter, then admit them. A ticket that is already used cannot be admitted again.</p>';
  h+='<div class="table-wrap"><table><thead><tr><th>Gate</th><th>Date</th><th>Name</th><th>Phone</th><th>Ticket</th><th>Qty</th><th>People</th><th>Ticket no.</th><th>Paid</th><th>Email</th><th>Contact</th></tr></thead><tbody id="salesBody"></tbody></table></div>';
  return h;
}
function salesRows(q){
  var f=state.salesFilter||'all',can=canCheckin();
  var rows=(state.sales.sales||[]).filter(function(r){return saleMatches(r,q)&&(f==='all'||saleStatus(r)===f);});
  if(!rows.length)return '<tr><td colspan="11"><div class="empty">'+((q||f!=='all')?'Nobody matches that.':'No tickets yet.')+'</div></td></tr>';
  return rows.map(function(r){
    var dt=new Date(r.paid_at||r.created_at),st=saleStatus(r);
    var gate='<div style="white-space:nowrap">'+admitBadge(r)+(can?' <button type="button" class="btn sm '+(st==='full'?'btn-line':'btn-red')+'" data-act="gate" data-ref="'+esc(r.reference)+'">'+(st==='full'?'View':'Check in')+'</button>':'')+'</div>'+
      (r.checked_in_at?'<div class="small">'+esc(timeShort(r.checked_in_at))+(r.checked_in_by?' · '+esc(r.checked_in_by):'')+'</div>':'');
    return '<tr'+(st==='full'?' class="row-used"':'')+'><td>'+gate+'</td><td>'+esc(isNaN(dt)?'':dt.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}))+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.phone)+'</td><td>'+esc(r.ticket_label||r.ticket_type)+'</td><td>'+esc(r.quantity||1)+'</td><td>'+saleTotal(r)+'</td><td><code>'+esc(r.ticket_number)+'</code></td><td>'+naira(r.amount)+'</td><td>'+(r.email_sent?'<span class="badge ok">Sent</span>':'<span class="badge warn">Not sent</span>')+'</td><td>'+esc(r.email)+'</td></tr>';
  }).join('');

function refreshSalesView(){
  if(!state.sales||state.sales.configured===false||!$('#salesBody'))return;
  var s=$('#salesSearch'),f=$('#salesFilter'),top=$('#salesTop');

}
function csvDownload(){
  var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var head=['Date','Name','Email','Phone','Ticket','Quantity','People covered','People checked in','Amount (NGN)','Ticket number','Reference','Email sent'];
  var lines=[head.join(',')].concat((state.sales.sales||[]).map(function(r){return [r.paid_at||r.created_at,r.name,r.email,r.phone,r.ticket_label||r.ticket_type,r.quantity||1,saleTotal(r),saleAdmitted(r),r.amount,r.ticket_number,r.reference,r.email_sent?'yes':'no'].map(q).join(',');}));

/* ---------- gate check-in ---------- */
function findSale(ref){return (state.sales&&state.sales.sales||[]).filter(function(r){return r.reference===ref;})[0];}
function updateSale(sale){var a=state.sales.sales;for(var i=0;i<a.length;i++){if(a[i].reference===sale.reference){a[i]=sale;return;}}}
function gateModal(ref,problem){
  var r=findSale(ref);if(!r)return;
  var a=saleAdmitted(r),t=saleTotal(r),left=t-a,st=saleStatus(r),can=canCheckin(),er=esc(r.reference);
  var last=r.checked_in_at?' (last '+esc(timeShort(r.checked_in_at))+(r.checked_in_by?' by '+esc(r.checked_in_by):'')+')':'';
  var banner=problem?'<div class="banner bad">'+esc(problem)+'</div>':
    st==='full'?'<div class="banner bad">ALREADY USED — all '+t+' admitted'+last+'. Do not give out another tag.</div>':
    st==='part'?'<div class="banner warn">'+a+' of '+t+' already admitted'+last+'. '+left+' still to come in.</div>':
    '<div class="banner ok">Valid — nobody from this ticket has been admitted yet.</div>';
  var h='<h3>'+esc(r.name||'Ticket')+'</h3>'+banner+
    '<dl class="kv"><dt>Ticket</dt><dd>'+esc(r.ticket_label||r.ticket_type)+(Number(r.quantity)>1?' × '+esc(r.quantity):'')+'</dd>'+
    '<dt>People</dt><dd>'+t+' ('+a+' admitted)</dd><dt>Phone</dt><dd>'+esc(r.phone)+'</dd>'+
    '<dt>Ticket no.</dt><dd>'+esc(r.ticket_number)+'</dd><dt>Reference</dt><dd>'+er+'</dd></dl>';
  if(can&&left>0){
    if(t>1)h+='<div class="row"><label for="gateCount" style="font-weight:800;font-size:13px">People coming in now</label><input type="number" id="gateCount" min="1" max="'+left+'" value="'+left+'"></div>';
    h+='<div class="row"><button class="btn btn-red" type="button" id="gateAdmit" data-act="admit" data-ref="'+er+'">Admit'+(t>1?'':' this person')+'</button><button class="btn btn-line" type="button" data-act="mclose">Close</button></div>';
  }else h+='<div class="row"><button class="btn btn-line" type="button" data-act="mclose">Close</button></div>';
  if(state.role==='owner'&&a>0)h+='<div class="row" style="border-top:1px solid var(--line);padding-top:12px"><span style="font-size:13px;font-weight:700">Admitted by mistake?</span><input type="number" id="undoCount" min="1" max="'+a+'" value="1" aria-label="How many to remove"><button class="btn btn-ghost sm danger" type="button" data-act="undo" data-ref="'+er+'">Remove from admitted</button></div>';
  h+='<div class="row"><button class="btn btn-ghost sm" type="button" data-act="history" data-ref="'+er+'">Show history</button></div><ul class="hist" id="gateHistory"></ul>';
  openModal(h);
  var c=$('#gateCount');if(c){c.focus();c.select();}else{var b=$('#gateAdmit');if(b)b.focus();}
}
function doAdmit(ref){
  var c=$('#gateCount'),n=c?parseInt(c.value,10):1,btn=$('#gateAdmit');
  if(!(n>=1)){toast('Enter how many people are coming in.',true);return;}
  btn.disabled=true;btn.textContent='Saving…';
  api('checkin',{body:{reference:ref,count:n}}).then(function(res){
    updateSale(res.sale);closeModal();refreshSalesView();
    toast('✓ Admitted '+n+' — '+(res.sale.name||'')+' ('+saleAdmitted(res.sale)+' of '+saleTotal(res.sale)+')');
    var s=$('#salesSearch');if(s){s.focus();s.select();}
  }).catch(function(e){
    if(e.status===401)return showLogin();
    if(e.data&&e.data.sale){updateSale(e.data.sale);refreshSalesView();gateModal(ref,e.message);return;}
    btn.disabled=false;btn.textContent='Admit';toast(e.message,true);
  });
}
function doUndo(ref){
  var r=findSale(ref),n=parseInt(($('#undoCount')||{}).value,10);
  if(!r||!(n>=1))return;
  if(!confirm('Remove '+n+' from the admitted count for '+(r.name||'this ticket')+'?'))return;
  api('checkin-undo',{body:{reference:ref,count:n}}).then(function(res){
    updateSale(res.sale);refreshSalesView();gateModal(ref);toast('Removed '+n+' from the admitted count');
  }).catch(function(e){
    if(e.status===401)return showLogin();
    if(e.data&&e.data.sale){updateSale(e.data.sale);refreshSalesView();gateModal(ref,e.message);return;}
    toast(e.message,true);
  });
}
function loadHistory(ref){
  var ul=$('#gateHistory');if(!ul)return;ul.innerHTML='<li>Loading…</li>';
  api('checkin-log&reference='+encodeURIComponent(ref)).then(function(d){
    var l=d.log||[];
    ul.innerHTML=l.length?l.map(function(x){return '<li>'+(x.action==='admit'?'Admitted ':'Removed ')+esc(x.delta)+' · '+esc(timeShort(x.created_at))+' · '+esc(x.by_name||'')+'</li>';}).join(''):'<li>Nobody has been checked in yet.</li>';
  }).catch(function(e){ul.innerHTML='<li>'+esc(e.message)+'</li>';});
}

/* ---------- check against Paystack (main admin only) ---------- */
function rcOpen(){
  openModal('<h3>Check against Paystack</h3><p class="help" style="margin:0 0 6px;font-size:13px;color:var(--muted)">Compares the successful payments on Paystack with the tickets saved here, and lets you recover any that are missing.</p>'+
    '<div class="row"><label for="rcDays" style="font-weight:800;font-size:13px">Look back</label><select id="rcDays" style="width:auto"><option value="1">24 hours</option><option value="3">3 days</option><option value="7" selected>7 days</option><option value="30">30 days</option></select>'+
    '<button class="btn btn-ink sm" type="button" data-act="rc-run">Check again</button><button class="btn btn-line sm" type="button" data-act="mclose">Close</button></div><div id="rcBody"></div>','wide');
  rcRun();
}
function rcRun(){
  var days=parseInt(($('#rcDays')||{}).value,10)||7;
  $('#rcBody').innerHTML='<div class="empty">Checking Paystack…</div>';
  api('reconcile&days='+days).then(function(d){state.rc=d;rcRender();}).catch(function(e){
    if(e.status===401)return showLogin();
    if($('#rcBody'))$('#rcBody').innerHTML='<div class="banner bad">'+esc(e.message)+'</div>';
  });
}
function rcMoney(n){return '₦'+Number(n||0).toLocaleString('en-NG');}
function rcRender(){
  var d=state.rc,box=$('#rcBody');if(!d||!box)return;
  var open=d.missing.filter(function(m){return m.state!=='done';}),ready=open.filter(function(m){return m.state==='ready';});
  var h='<div class="banner '+(open.length?'warn':'ok')+'" style="margin-top:12px">Paystack shows '+d.checked+' successful payment'+(d.checked===1?'':'s')+' in the last '+d.days+' day'+(d.days===1?'':'s')+'. '+
    (open.length?open.length+' '+(open.length===1?'is':'are')+' missing here.':'Everything is saved here ✓')+'</div>';
  if(d.truncated)h+='<div class="banner warn">There are more payments than could be checked at once. Choose a shorter period.</div>';
  if(ready.length>1)h+='<div class="row"><button class="btn btn-red" type="button" data-act="rc-all">Import all '+ready.length+' valid payments</button></div>';
  if(open.length||d.missing.length)h+='<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:700;font-size:13px"><input type="checkbox" id="rcEmail" checked> Email the ticket to the buyer when importing (they did not get one if the payment was never recorded)</label>';
  d.missing.forEach(function(m,i){
    var when=m.paidAt?timeShort(m.paidAt):'',meta=esc(m.email||'no email')+(m.phone?' · '+esc(m.phone):'')+(m.channel?' · paid by '+esc(m.channel):'')+' · '+esc(when)+'<br><code>'+esc(m.reference)+'</code>';
    var top='<div class="rc-top"><span>'+esc(m.name)+'</span><span>'+rcMoney(m.amount)+'</span></div><div class="rc-meta">'+meta+'</div>';
    if(m.state==='done'){h+='<div class="rc-card done">'+top+'<div class="rc-note" style="color:var(--ok)">'+esc(m.note)+'</div></div>';return;}
    if(m.state==='ready'){
      h+='<div class="rc-card ready">'+top+'<div class="rc-note">Looks like a valid ticket: '+esc(m.quantity)+' × '+esc(m.ticketLabel)+(m.admitsTotal>1?' (admits '+m.admitsTotal+')':'')+'.</div>'+
        '<div class="row"><button class="btn btn-red sm" type="button" data-act="rc-import" data-idx="'+i+'">Import ticket</button></div></div>';
      return;
    }
    var opts=d.tickets.map(function(t){return '<option value="'+esc(t.id)+'"'+(t.id===m.ticketType?' selected':'')+'>'+esc(t.label)+' — '+rcMoney(t.price)+'</option>';}).join('');
    h+='<div class="rc-card review">'+top+'<div class="rc-note" style="color:var(--red)">Needs your decision: '+esc(m.reason)+'</div>'+
      '<div class="row"><select id="rcT'+i+'" aria-label="Ticket type" style="width:auto;max-width:100%">'+opts+'</select><input type="number" id="rcQ'+i+'" min="1" max="500" value="'+esc(m.quantity||1)+'" aria-label="Quantity" style="width:80px">'+
      '<button class="btn btn-ink sm" type="button" data-act="rc-import" data-idx="'+i+'">Import as chosen</button></div></div>';
  });
  box.innerHTML=h;
}
function rcImportOne(i){
  var m=state.rc.missing[i];
  var body={reference:m.reference,sendEmail:$('#rcEmail')?$('#rcEmail').checked:true};
  if(m.state==='review'){body.ticketType=$('#rcT'+i).value;body.quantity=parseInt($('#rcQ'+i).value,10)||1;}
  return api('reconcile-import',{body:body}).then(function(res){
    m.state='done';m.note=(res.quantity>1?res.quantity+' × ':'')+res.ticket+' saved'+(res.emailSent?' and ticket emailed ✓':(body.sendEmail?' ✓ (email not sent: '+(res.emailError||'unknown')+')':' ✓'));
    api('sales').then(function(d){state.sales=d;refreshSalesView();}).catch(function(){});
  }).catch(function(e){
    if(e.status===401){showLogin();throw e;}
    if(e.data&&e.data.already){m.state='done';m.note='Already saved.';return;}
    toast(e.message,true);throw e;
  });
}
function rcImport(i,btn){btn.disabled=true;btn.textContent='Importing…';rcImportOne(i).then(rcRender,rcRender);}
function rcImportAll(btn){
  btn.disabled=true;
  var idx=[];state.rc.missing.forEach(function(m,i){if(m.state==='ready')idx.push(i);});
  var chain=Promise.resolve();
  idx.forEach(function(i){chain=chain.then(function(){return rcImportOne(i);}).then(rcRender);});
  chain.then(function(){toast('All valid payments imported ✓');},rcRender);
}

    '<div class="field"><label for="tmEmail">Email</label><input type="email" id="tmEmail" placeholder="name@example.com"></div>'+
    '<div class="field full"><label for="tmRole">Role</label><select id="tmRole"><option value="tickets">Ticket in charge — sees every buyer and checks people in at the gate</option><option value="sales">Sales — sees every buyer, view only</option></select>'+
    '<p class="help">Neither role can edit tickets, prices or the website, upload files, or invite anyone.</p></div></div>'+
    '<p style="margin:14px 0 0"><button class="btn btn-red" type="button" id="tmInvite" data-act="invite">Send invite</button></p>';
  var r=state.teamResult;
  if(r)h+='<div class="notice" style="margin:14px 0 0">'+(r.emailSent?'✅ Invite emailed.':'⚠ The email could not be sent ('+esc(r.emailError||'unknown error')+'). Copy the link below and send it to them yourself.')+
    '<div class="linkbox"><input type="text" id="tmLink" readonly value="'+esc(r.link)+'"><button class="btn btn-line sm" type="button" data-act="copylink">Copy</button></div>'+
    '<div class="small">This link works once and expires in 72 hours. It cannot be shown again, but you can send a fresh one any time.</div></div>';
  h+='</section><section class="card"><h3>Your team</h3>';
  var d=state.team;
  if(!d)h+='<div class="empty">Loading…</div>';
  else if(!d.members.length)h+='<div class="empty">Nobody yet. Invite your first team member above.</div>';
  else h+='<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last login</th><th></th></tr></thead><tbody>'+d.members.map(function(m){
    var act=m.status==='active';
    return '<tr><td>'+esc(m.name||'—')+'</td><td>'+esc(m.email)+'</td>'+
      '<td><select data-teamrole="'+esc(m.id)+'" aria-label="Role for '+esc(m.email)+'" style="min-width:150px"><option value="tickets"'+(m.role==='tickets'?' selected':'')+'>Ticket in charge</option><option value="sales"'+(m.role==='sales'?' selected':'')+'>Sales</option></select></td>'+
      '<td>'+(act?'<span class="badge ok">Active</span>':'<span class="badge warn">Invite pending</span>'+(m.invite_expires_at?'<div class="small">expires '+esc(timeShort(m.invite_expires_at))+'</div>':''))+'</td>'+
      '<td>'+esc(m.last_login_at?timeShort(m.last_login_at):'—')+'</td>'+
      '<td style="white-space:nowrap"><button class="btn btn-line sm" type="button" data-act="resend" data-id="'+esc(m.id)+'">'+(act?'Send reset link':'Resend invite')+'</button> <button class="btn btn-ghost sm danger" type="button" data-act="remove" data-id="'+esc(m.id)+'" data-name="'+esc(m.name||m.email)+'">Remove</button></td></tr>';
  }).join('')+'</tbody></table></div>';
  return h+'</section>';
}
function loadTeam(keepResult){
  if(!keepResult)state.teamResult=null;
  state.team=null;render();
  api('team-list').then(function(d){state.team=d;render();}).catch(function(e){if(e.status===401)return showLogin();toast(e.message,true);});
}
function reloadTeamList(){return api('team-list').then(function(d){state.team=d;render();});}
function teamFail(b,label){return function(e){if(e.status===401)return showLogin();toast(e.message,true);if(b){b.disabled=false;b.textContent=label;}};}
function doInvite(){
  var email=$('#tmEmail').value.trim(),b=$('#tmInvite');
  if(!email){toast('Enter an email address.',true);return;}
  b.disabled=true;b.textContent='Sending…';
  api('team-invite',{body:{name:$('#tmName').value.trim(),email:email,role:$('#tmRole').value}}).then(function(res){
    state.teamResult=res;toast(res.emailSent?'Invite sent ✓':'Invite created — copy the link',!res.emailSent);return reloadTeamList();
  }).catch(teamFail(b,'Send invite'));
}

/* ---------- main render ---------- */
function warnThumb(th){
  var f=th&&th.closest('.field'),m=f&&f.querySelector('.msg');
  if(m){m.textContent='⚠ This file cannot be opened from its link. If you uploaded it, the Supabase bucket "site-media" must be Public. Click “Check connection” at the top.';m.className='msg err';}
}
function refreshThumb(input){
  /* update just the preview, never re-draw the page (that would swallow the user's next click) */
  var f=input.closest('.field'),th=f&&f.querySelector('.thumb'),m=f&&f.querySelector('.msg');
  if(m){m.textContent='';m.className='msg';}
  if(!th)return;
  var u=srcUrl(input.value);th.setAttribute('data-src',u);
  th.style.backgroundImage=u?"url('"+u.replace(/'/g,'%27')+"')":'';
  if(u){var im=new Image();im.onerror=function(){warnThumb(th);};im.src=u;}
}
function render(){
  var vis=visibleSections(),sec=vis.filter(function(s){return s.id===state.section;})[0]||vis[0];
  $('#pageTitle').textContent=sec.title;
  $('#nav').innerHTML=vis.map(function(s){if(s.sep)return '<div class="sep"></div><div class="sep-label">'+esc(s.sep)+'</div>';return (s.id==='tickets'?'<div class="sep"></div>':'')+'<button type="button" data-sec="'+s.id+'" '+(s.id===sec.id?'aria-current="true"':'')+'><span class="ico">'+s.icon+'</span>'+esc(s.title)+'</button>';}).join('');
  var v=$('#view'),h='';
  if(sec.custom==='tickets')h=ticketsHtml();
  else if(sec.custom==='sales')h=salesHtml();
  else if(sec.custom==='team')h=teamHtml();
  else h=sec.blocks.map(blockHtml).join('');
  v.innerHTML=h;
  var warn=warnThumb;
  v.querySelectorAll('.thumb[data-src]').forEach(function(th){var im=new Image();im.onerror=function(){warn(th);};im.src=th.getAttribute('data-src');});
  v.querySelectorAll('.thumb video').forEach(function(vd){vd.addEventListener('error',function(){warn(vd.parentNode);});});
  if(sec.custom==='sales')refreshSalesView();
}

/* ---------- events ---------- */
function handleAct(t){
  var a=t.dataset.act,ref=t.dataset.ref;
  if(a==='gate'){gateModal(ref);return;}
  if(a==='mclose'){closeModal();return;}
  if(a==='admit'){doAdmit(ref);return;}
  if(a==='undo'){doUndo(ref);return;}
  if(a==='history'){loadHistory(ref);return;}
  if(a==='rc-open'){rcOpen();return;}
  if(a==='rc-run'){rcRun();return;}
  if(a==='rc-import'){rcImport(parseInt(t.dataset.idx,10),t);return;}
  if(a==='rc-all'){rcImportAll(t);return;}
  if(a==='invite'){doInvite();return;}
  if(a==='copylink'){
    var i=$('#tmLink');if(!i)return;i.select();
    var done=function(){toast('Link copied');};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(i.value).then(done,function(){document.execCommand('copy');done();});
    else{document.execCommand('copy');done();}
    return;
  }
  if(a==='resend'){
    t.disabled=true;
    api('team-resend',{body:{id:t.dataset.id}}).then(function(res){state.teamResult=res;toast(res.emailSent?'Email sent ✓':'Link created — copy it',!res.emailSent);return reloadTeamList();}).catch(teamFail(t,'Resend'));
    return;
  }
  if(a==='remove'){
    if(!confirm('Remove '+t.dataset.name+'? They will lose access immediately.'))return;
    api('team-remove',{body:{id:t.dataset.id}}).then(function(){toast('Removed');return reloadTeamList();}).catch(teamFail());
    return;
  }
}
document.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('modal-back')){closeModal();return;}
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.act){handleAct(t);return;}
  if(t.dataset.sec){state.section=t.dataset.sec;if(t.dataset.sec==='sales')loadSales();else if(t.dataset.sec==='team')loadTeam();else render();window.scrollTo(0,0);return;}
  if(t.dataset.add){
    var L=listSpec(t.dataset.add),arr=getP(state.content,t.dataset.add),item=L.strings?'':clone(L.blank);
    if(item&&typeof item==='object'&&'id' in item)item.id=newId();
    if(L.askYear){
      var yr=prompt('Which year is this gallery for? (for example '+new Date().getFullYear()+')',String(new Date().getFullYear()));
      if(yr===null)return;yr=String(yr).trim();
      if(!/^(19|20)\d\d$/.test(yr)){toast('Please enter a 4-digit year, like 2026.',true);return;}
      if(arr.some(function(x){return String(x.year)===yr;})&&!confirm('You already have a gallery for '+yr+'. Add another one?'))return;
      item.year=yr;
    }
    arr.push(item);markDirty();render();return;
  }
  if(t.dataset.del){var p=t.dataset.del.split('|');if(confirm('Delete this item?')){getP(state.content,p[0]).splice(+p[1],1);markDirty();render();}return;}
  if(t.dataset.move){var m=t.dataset.move.split('|'),a=getP(state.content,m[0]),i=+m[1],j=i+ +m[2];if(a[j]!==undefined){var x=a[i];a[i]=a[j];a[j]=x;markDirty();render();}return;}
  if(t.dataset.bulkpick){
    var bp=t.dataset.bulkpick.split('|'),bi=document.createElement('input');bi.type='file';bi.multiple=true;
    bi.accept=bp[1]==='video'?'video/mp4,video/webm,video/quicktime':'image/jpeg,image/png,image/webp,image/gif';
    bi.onchange=function(){if(bi.files.length)bulkUpload(bp[0],bp[1],bi.files);};bi.click();return;
  }
  if(t.id==='addTicket'){
    var name=prompt('Name of the new ticket (e.g. “Last Chance — Single”)');if(!name)return;
    var price=parseInt(prompt('Price in naira (numbers only)'),10);if(!(price>=100)){toast('Enter a price of ₦100 or more.',true);return;}
    var base=name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,28)||'ticket',id=base,n=1;
    while(state.content.tickets.some(function(x){return x.id===id;}))id=base+'_'+(++n);
    var admits=parseInt(prompt('How many people does ONE of these tickets admit? (1 for a single, 4 for a Group of 4)','1'),10);if(!(admits>=1&&admits<=20)){toast('Enter a number from 1 to 20.',true);return;}
    state.content.tickets.push({id:id,label:name.trim(),price:price,admits:admits,active:true});markDirty();render();return;
  }
  if(t.dataset.tkdel!==undefined){if(confirm('Delete this ticket type? Turning it off is usually safer.')){state.content.tickets.splice(+t.dataset.tkdel,1);markDirty();render();}return;}
  if(t.dataset.upload){
    var field=t.closest('.field'),input=field.querySelector('input[data-bind]'),bar=field.querySelector('.bar'),msg=field.querySelector('.msg');
    var fi=document.createElement('input');fi.type='file';fi.accept=t.dataset.upload;
    fi.onchange=function(){
      var f=fi.files[0];if(!f)return;
      if(f.size>50*1024*1024){msg.textContent='File is over 50 MB.';msg.className='msg err';return;}
      msg.textContent='Uploading…';msg.className='msg';bar.hidden=false;bar.firstChild.style.width='0';t.disabled=true;
      var folder=t.dataset.kind==='video'?'videos':(t.dataset.kind==='pdf'?'files':'images');
      uploadFile(f,folder,function(p){bar.firstChild.style.width=Math.round(p*100)+'%';}).then(function(url){
        setP(state.content,input.dataset.bind,url);markDirty();render();toast('Uploaded ✓ — now click “Publish changes” to show it on the website');$('#saveBtn').classList.add('pulse');
      }).catch(function(err){msg.textContent=err.message;msg.className='msg err';bar.hidden=true;t.disabled=false;});
    };
    fi.click();return;
  }
  if(t.hasAttribute('data-clear')){var inp=t.closest('.field').querySelector('input[data-bind]');setP(state.content,inp.dataset.bind,'');markDirty();render();return;}
  if(t.id==='salesRefresh'){loadSales();return;}
  if(t.id==='salesCsv'){csvDownload();return;}
});

document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='salesSearch'){$('#salesBody').innerHTML=salesRows(el.value);return;}
  if(el.dataset.tk!==undefined){
    var tk=state.content.tickets[+el.dataset.tk],f=el.dataset.tkf;
    tk[f]=el.type==='checkbox'?el.checked:(f==='price'?parseInt(el.value,10)||0:(f==='admits'?Math.min(20,Math.max(1,parseInt(el.value,10)||1)):el.value));markDirty();return;
  }

document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='salesFilter'){state.salesFilter=el.value;refreshSalesView();return;}
  if(el.dataset.teamrole){
    el.disabled=true;
    api('team-role',{body:{id:el.dataset.teamrole,role:el.value}}).then(function(){toast('Role updated ✓');return reloadTeamList();}).catch(function(err){if(err.status===401)return showLogin();toast(err.message,true);reloadTeamList();});
    return;

  if(el.dataset.bind){ /* keep a card's heading in step with its title/name/year, without redrawing the page */

    if(sp&&sp.titleKey===mt[3]){var cd=el.closest('section.card'),hd=cd&&cd.querySelector('.item-head h3');if(hd)hd.textContent=el.value||'Untitled';}
  }
  if(el.dataset.type==='image')refreshThumb(el);
});

/* ---------- bulk upload (many photos / videos at once) ---------- */
var BULK={busy:false};
function bulkPanel(msg,fails,pct,final){
  var el=$('#bulk');
  if(!el){el=document.createElement('div');el.id='bulk';el.className='bulk';document.body.appendChild(el);}
  el.hidden=false;
  el.innerHTML='<b>'+esc(msg||'')+'</b>'+(pct!=null&&!final?'<div class="bar"><i style="width:'+Math.round(pct*100)+'%"></i></div>':'')+
    (fails&&fails.length?'<ul>'+fails.slice(0,8).map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+(fails.length>8?'<li>…and '+(fails.length-8)+' more</li>':'')+'</ul>':'')+
    (final?'<button type="button" onclick="this.parentNode.hidden=true">Close</button>':'');
}
function bulkUpload(path,kind,fileList){
  if(BULK.busy){toast('An upload is already running. Please wait for it to finish.',true);return;}
  var okType=kind==='video'?/^video\/(mp4|webm|quicktime)$/:/^image\/(jpeg|png|webp|gif)$/;
  var bad=[],queue=[];
  [].slice.call(fileList).forEach(function(f){
    if(!okType.test(f.type))bad.push(f.name+': not a '+(kind==='video'?'video (MP4, WebM or MOV)':'photo (JPG, PNG, WEBP or GIF)'));
    else if(kind==='video'&&f.size>50*1024*1024)bad.push(f.name+': over 50 MB');
    else if(f.size>30*1024*1024)bad.push(f.name+': over 30 MB');
    else queue.push(f);
  });
  if(!queue.length){bulkPanel('No files were added',bad,1,true);return;}
  BULK.busy=true;
  var spec=listSpec(path),key=kind==='video'?'src':'image',folder=kind==='video'?'videos':'images',word=kind==='video'?'video':'photo';
  var total=queue.length,done=0,next=0,results=new Array(total),fails=bad.slice();
  function paint(){bulkPanel('Uploading '+word+'s: '+done+' of '+total,fails,done/total);}
  paint();
  function worker(){
    if(next>=total)return Promise.resolve();
    var i=next++,f=queue[i];
    return uploadFile(f,folder,function(){}).then(function(u){results[i]=u;}).catch(function(e){fails.push(f.name+': '+e.message);}).then(function(){done++;paint();return worker();});
  }
  Promise.all([worker(),worker(),worker()]).then(function(){
    var arr=getP(state.content,path),added=0;
    results.forEach(function(u){if(u){var it=clone(spec.blank);it[key]=u;arr.push(it);added++;}});
    BULK.busy=false;markDirty();render();
    bulkPanel(added?'Added '+added+' '+word+(added===1?'':'s')+'. Now click “Publish changes”.':'Nothing was added',fails,1,true);
    if(added)$('#saveBtn').classList.add('pulse');
  });
}
document.addEventListener('dragover',function(e){var z=e.target.closest&&e.target.closest('.dropzone');if(z){e.preventDefault();z.classList.add('over');}});
document.addEventListener('dragleave',function(e){var z=e.target.closest&&e.target.closest('.dropzone');if(z)z.classList.remove('over');});
document.addEventListener('drop',function(e){
  var z=e.target.closest&&e.target.closest('.dropzone');if(!z)return;
  e.preventDefault();z.classList.remove('over');
  var tag=z.getAttribute('data-bulk').split('|');if(e.dataTransfer&&e.dataTransfer.files.length)bulkUpload(tag[0],tag[1],e.dataTransfer.files);
});
window.addEventListener('dragover',function(e){e.preventDefault();});  /* a missed drop must not navigate away from the dashboard */
window.addEventListener('drop',function(e){e.preventDefault();});

/* ---------- login / boot ---------- */
function showLogin(){closeModal();$('#app').hidden=true;$('#invite').hidden=true;$('#login').hidden=false;setTimeout(function(){$('#em').focus();},50);}
function applyRole(){
  var owner=state.role==='owner',w=$('#who');
  $('#saveBtn').hidden=!owner;$('#checkBtn').hidden=!owner;
  if(!owner&&state.me){w.textContent=(state.me.name||state.me.email||'')+' · '+roleLabel(state.role);w.hidden=false;}else w.hidden=true;
}
function boot(){
  api('me').then(function(me){
    state.me=me;state.role=me.role||'owner';state.sales=null;state.team=null;applyRole();
    if(state.role!=='owner'){
      /* Team members never load the website content: the server would refuse it anyway. */
      state.content=null;state.section='sales';
      $('#login').hidden=true;$('#invite').hidden=true;$('#app').hidden=false;loadSales();return;
    }
    return api('content').then(function(c){
      state.content=c;state.saved=JSON.stringify(c);
      $('#login').hidden=true;$('#invite').hidden=true;$('#app').hidden=false;render();markDirty();
      if(!me.supabase)$('#view').insertAdjacentHTML('afterbegin','<div class="notice">Supabase is not connected yet. You can look around, but publishing and uploads will not work until you finish step 2 of the README.</div>');
    });
  }).catch(function(e){
    if(e.status===503){document.body.innerHTML='<div class="login"><div class="login-card"><h1>Almost there</h1><p>'+esc(e.message)+'</p></div></div>';return;}
    showLogin();
  });
}
$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault();var b=$('#loginBtn');b.disabled=true;b.textContent='Checking…';$('#loginErr').textContent='';
  api('login',{body:{email:$('#em').value.trim(),password:$('#pw').value}}).then(function(){$('#pw').value='';boot();})
   .catch(function(err){$('#loginErr').textContent=err.message;})
   .then(function(){b.disabled=false;b.textContent='Log in';});
});

/* ---------- invite link (/admin?invite=...) ---------- */
var INVITE_TOKEN=(function(){try{return new URLSearchParams(location.search).get('invite')||'';}catch(e){return '';}})();
function showInvite(){
  $('#login').hidden=true;$('#app').hidden=true;$('#invite').hidden=false;
  api('invite-info&token='+encodeURIComponent(INVITE_TOKEN)).then(function(d){
    $('#inviteIntro').textContent=d.reset?('Hi '+(d.name||d.email)+', choose a new password for '+d.email+'.'):('Hi '+(d.name||d.email)+'! You have been invited as '+d.roleLabel+'. Choose a password to get started.');
    $('#inviteFields').hidden=false;
  }).catch(function(e){$('#inviteIntro').textContent='';$('#inviteFail').textContent=e.message;});
}
$('#inviteForm').addEventListener('submit',function(e){
  e.preventDefault();
  var p1=$('#ipw').value,p2=$('#ipw2').value,b=$('#inviteBtn'),err=$('#inviteErr');err.textContent='';
  if(p1.length<8){err.textContent='Use at least 8 characters.';return;}
  if(p1!==p2){err.textContent='The two passwords do not match.';return;}
  b.disabled=true;b.textContent='Saving…';
  api('invite-accept',{body:{token:INVITE_TOKEN,password:p1}}).then(function(){
    $('#ipw').value='';$('#ipw2').value='';INVITE_TOKEN='';
    try{history.replaceState(null,'','/admin');}catch(x){}
    boot();
  }).catch(function(ex){err.textContent=ex.message;}).then(function(){b.disabled=false;b.textContent='Save password & continue';});
});

$('#checkBtn').addEventListener('click',function(){
  var b=this;b.disabled=true;b.textContent='Checking…';
  api('diagnose').then(function(d){
    var old=$('#diag');if(old)old.remove();
    var html='<div class="notice" id="diag"><b>'+(d.allOk?'Everything is connected ✓':'Something needs fixing')+'</b><ul style="margin:8px 0 0;padding-left:20px">'+
      d.checks.map(function(c){return '<li style="margin-bottom:6px">'+(c.ok?'✅':'❌')+' <b>'+esc(c.name)+'</b>'+(c.ok&&c.detail==='OK'?'':'<br><span style="font-weight:600;font-size:13px;word-break:break-word">'+esc(c.detail)+'</span>')+'</li>';}).join('')+'</ul>'+
      '<button class="btn btn-ghost sm" type="button" onclick="this.parentNode.remove()">Close</button></div>';
    $('#view').insertAdjacentHTML('afterbegin',html);window.scrollTo(0,0);
  }).catch(function(e){if(e.status===401)return showLogin();toast(e.message,true);})
   .then(function(){b.disabled=false;b.textContent='Check connection';});
});
$('#saveBtn').addEventListener('click',save);
$('#logoutBtn').addEventListener('click',function(){
  if(state.dirty&&!confirm('You have unpublished changes. Log out anyway?'))return;
  state.dirty=false;api('logout',{body:{}}).then(function(){location.reload();});
});
registerLists();
if(INVITE_TOKEN)showInvite();else boot();

/* Keep the gate list fresh when several people check in at once. */
var _salesBusy=false;
setInterval(function(){
  if(document.hidden||$('#app').hidden||state.section!=='sales'||$('#modalHost').firstChild||_salesBusy)return;
  _salesBusy=true;
  api('sales').then(function(d){if(state.section==='sales'&&!$('#modalHost').firstChild){var was=state.role;state.sales=d;followRole(d);if(was!==state.role)render();else refreshSalesView();}}).catch(function(e){if(e.status===401)showLogin();}).then(function(){_salesBusy=false;});
},20000);
